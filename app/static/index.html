<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<style>
:root{--bg:#fbfaf9;--panel:#fff;--ink:#1a1a18;--mut:#6b6862;--line:#e6e3de;--acc:#2f6f4f;
--pos:#1a7f4b;--neg:#b3352b;--warn:#8a5a00;--chip:#f2efea}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--panel:#1e1d1a;--ink:#eceae6;--mut:#9a958c;
--line:#2f2d29;--acc:#6fc296;--pos:#5bbd88;--neg:#e2796d;--warn:#d9a441;--chip:#26241f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:20px;
align-items:baseline;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:16px;margin:0;letter-spacing:-.01em}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-left:auto}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi b .pos{color:var(--pos)} .kpi b .neg{color:var(--neg)}
.kpi b .na{color:var(--mut)}
.kpi.date b{font-size:13px;font-weight:500;color:var(--mut);padding-top:5px}
.kpi span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;padding:11px 14px;color:var(--mut);cursor:pointer;
font:inherit;border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
main{padding:20px 22px 60px;max-width:1280px}
/* Holdings is a twelve-column table, not prose: it gets whatever the screen has, while
   the reading-width cap stays for every other tab. Driven by a class rather than :has(),
   which not every browser this might be opened in will support. */
main.full{max-width:none}
.card.full{max-width:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--chip)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.ih{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;
  border:1px solid var(--mut);color:var(--mut);border-radius:50%;font-size:9px;
  font-style:italic;font-weight:600;cursor:help;vertical-align:middle;margin-left:4px;
  text-transform:none;letter-spacing:0}
.ih:hover{border-color:var(--acc);color:var(--acc)}
/* Marks a cell that is showing a simple return where an annual rate would mislead. */
.smark{font-size:9px;font-weight:700;color:var(--mut);cursor:help;margin-left:2px;
  border-bottom:1px dotted var(--mut)}
#tlog{max-width:min(820px,92vw);width:100%}
.tr-sell td{background:color-mix(in srgb,var(--warn) 7%,transparent)}
.tr-lot td{font-size:11px;padding-top:2px;padding-bottom:2px}
.flowlink{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc)}
.flowlink:hover{border-bottom-style:solid}
.cname{font-size:11px;color:var(--mut);font-weight:400;margin-top:1px;max-width:240px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Bound the name itself rather than every first column in the app — report tables and
   the fundamentals grid share that selector and must not be squeezed. */
.fname{display:block;font-weight:600;line-height:1.3;cursor:help;max-width:260px}
/* Holdings carries twelve columns, so a 50-character fund name pushes the numbers off
   screen. Wrap it tighter here and tighten the cell padding; the numeric columns keep
   tabular figures so they still line up. */
.dense .fname{max-width:170px;font-size:12px}
.dense .cname{max-width:170px}
.dense th,.dense td{padding:6px 8px;font-size:12px}
.dense{table-layout:auto;width:100%}
/* Rather than scroll on a small screen, shed columns in reverse order of usefulness.
   Ticker, XIRR, Simple, Value and Net P/L survive to the narrowest width — those are
   what the table is for; Flows, Held, Divs and Sector are context. */
@media (max-width:1500px){ .dense .c5{display:none} }
@media (max-width:1250px){ .dense .c4{display:none} }
@media (max-width:1050px){ .dense .c3{display:none} }
@media (max-width:860px){  .dense .c2{display:none} }
@media (max-width:680px){  .dense .c1{display:none; } .dense .fname,.dense .cname{max-width:120px} }
.dense td:first-child,.dense th:first-child{position:sticky;left:0;background:var(--panel)}
.chip.re{background:transparent;border:1px solid var(--warn);color:var(--warn);
  font-size:10px;cursor:help}
.wrap{overflow-x:auto}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
/* Allocation carries fund names that run to 40+ characters, so it gets the wider column
   and both children get min-width:0 — without it a grid item refuses to shrink below its
   content and the table scrolls sideways instead of the name ellipsing. */
.grid.wide{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.grid.wide>*{min-width:0}
@media (max-width:900px){.grid.wide{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 9px;
font-size:11px;color:var(--mut);margin-right:4px}
pre{background:var(--chip);padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;
white-space:pre-wrap;line-height:1.45;max-height:340px;overflow-y:auto}
button.act{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 14px;
cursor:pointer;font:inherit;font-weight:600}
button.act.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);padding:7px 15px;
font:inherit;color:var(--mut);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff;font-weight:600}
header .seg{margin-left:4px}
header .seg button{padding:5px 12px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.prhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:0}
.prhead b{font-size:13px}
.banner{border-left:3px solid var(--warn);background:var(--chip);padding:10px 14px;
border-radius:0 8px 8px 0;margin-bottom:14px;font-size:13px}
select,input{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;
background:var(--panel);color:var(--ink)}
.day{border-bottom:1px solid var(--line);padding:9px 0}
.day .h{display:flex;justify-content:space-between;font-weight:600;margin-bottom:5px}
.tick{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;margin:2px 3px 0 0;font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
max-width:460px;padding:20px}dialog::backdrop{background:#0008}
.miss{color:var(--mut);font-style:italic}
.stage{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
padding:10px 8px 4px;font-weight:600}
tr.pending td{opacity:.45}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
vertical-align:middle;background:var(--line)}
.dot.run{background:var(--acc);animation:pulse 1.1s ease-in-out infinite}
.dot.done{background:var(--pos)} .dot.err{background:var(--neg)}
.dot.skip{background:transparent;border:1px solid var(--line)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.verdict{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;
background:var(--chip);border-radius:9px;padding:13px 16px;margin:12px 0}
.verdict b{display:block;font-size:19px;letter-spacing:-.02em}
.verdict span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.md{line-height:1.6} .md h3{font-size:13px;margin:14px 0 6px}
.md p{margin:9px 0} .md ul,.md ol{margin:8px 0;padding-left:22px}
.md ol li{margin:6px 0} .md li{margin:3px 0}
.md strong{font-weight:650}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.rating{display:inline-block;padding:5px 14px;border-radius:8px;font-weight:700;
font-size:17px;letter-spacing:-.01em}
.rating.buy{background:#1a7f4b1f;color:var(--pos);border:1px solid #1a7f4b55}
.rating.hold{background:#8a5a001f;color:var(--warn);border:1px solid #8a5a0055}
.rating.sell{background:#b3352b1f;color:var(--neg);border:1px solid #b3352b55}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.hi{background:#1a7f4b1f;color:var(--pos)}
.pill.mid{background:#8a5a001f;color:var(--warn)}
.pill.lo{background:#b3352b1f;color:var(--neg)}
.warnw{color:var(--warn)}
.md table{margin:10px 0;font-size:13px}
.md th{position:static;background:transparent;cursor:default}
.md td,.md th{border-bottom:1px solid var(--line);padding:5px 9px}
.md td:first-child{text-align:left}
.copy{background:transparent;border:1px solid var(--line);border-radius:6px;
padding:2px 9px;font:inherit;font-size:11px;color:var(--mut);cursor:pointer;margin-left:8px}
.copy:hover{color:var(--ink)}
.dca{background:var(--chip);border-radius:9px;padding:14px 16px;margin:12px 0}
.dca h4{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.dca .g{display:flex;gap:24px;flex-wrap:wrap}
.dca b{display:block;font-size:16px;letter-spacing:-.02em}
.dca span{font-size:11px;color:var(--mut)}
summary{display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
.chev{display:inline-block;width:13px;color:var(--mut);transition:transform .12s;flex:none}
details[open] .chev{transform:rotate(90deg)}
details{border:1px solid var(--line);border-radius:8px;padding:4px 12px;background:var(--panel)}
details[open]{padding-bottom:10px}
.secbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
</style></head><body>
<header><h1>Trans</h1><span class="seg" id="mkt"></span><div class="kpis" id="kpis"></div></header>
<nav id="nav"></nav><main id="main">loading…</main>
<dialog id="consent"></dialog>
<dialog id="tlog"></dialog>
<script>
const $=s=>document.querySelector(s);
let MKT={key:'us',symbol:'$',locale:'en-US',currency:'USD',label:'US',flag:'🇺🇸'};
const fmt=(n,d=0)=>n==null?'—':n.toLocaleString(MKT.locale,{minimumFractionDigits:d,maximumFractionDigits:d});
// Amounts are always in the selected market's own currency — the two are never summed
// or converted, so this only ever needs to format, never to translate a value.
const usd=(n,d=0)=>n==null?'—':MKT.symbol+fmt(n,d);
const pct=(n,d=2)=>n==null?'—':(n*100).toFixed(d)+'%';
const sign=n=>n==null?'mut':n>=0?'pos':'neg';
const get=u=>fetch(u).then(r=>r.json());
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b||{})}).then(r=>r.json());
let STATE={};

// Every control the user can change is remembered, so coming back to a screen does not
// mean setting it up again. localStorage is per browser and per origin, which is exactly
// the right scope for "how I like to look at my own dashboard"; it is wrapped because a
// private window or blocked site data makes the accessor itself throw, and a dashboard
// must not fail to render over a saved sort order.
const PREFS_KEY='trans.prefs.v1';
let PREFS={};
try{ PREFS=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')||{}; }catch(e){ PREFS={}; }
function pref(k,dflt){ return PREFS[k]===undefined?dflt:PREFS[k]; }
function setPref(k,v){
  PREFS[k]=v;
  try{ localStorage.setItem(PREFS_KEY,JSON.stringify(PREFS)); }catch(e){}
}

// [key, label, url path]. Overview lives at / so the root is not a redirect.
const TABS=[['overview','Overview','/'],['holdings','Holdings','/holdings'],
 ['buys','Daily buys','/daily-buys'],['div','Dividends','/dividends'],
 ['analysis','Analysis','/analysis'],['fund','Fundamentals','/fundamentals'],
 ['research','Research','/research'],['sync','Sync & cost','/sync']];
const PATH_OF=Object.fromEntries(TABS.map(([k,,p])=>[k,p]));
let tab='overview';

// Two tabs carry a ticker in the URL (/fundamentals/MSFT, /research/MSFT) so a
// specific holding or report can be linked to directly.
const TICKER_TABS={fund:'/fundamentals',research:'/research'};

const MARKET_KEYS=['us','in'];

// URLs are /<market>/<tab>[/<ticker>] — the market leads because the two are never
// combined, so every view belongs to exactly one of them.
function routeFrom(pathname){
  const seg=decodeURIComponent(pathname).replace(/\/+$/,'').split('/').filter(Boolean);
  const market=MARKET_KEYS.includes((seg[0]||'').toLowerCase())
    ? seg.shift().toLowerCase() : (STATE.market||'us');
  if(!seg.length) return {market,tab:'overview',ticker:null};
  const hit=TABS.find(([,,p])=>p==='/'+seg[0]);
  if(!hit) return {market,tab:'overview',ticker:null};
  return {market, tab:hit[0], ticker:seg[1]?seg[1].toUpperCase():null};
}

function urlFor(t,ticker,market){
  const m=market||STATE.market||'us';
  const base=PATH_OF[t]||'/';
  const tail=(ticker && TICKER_TABS[t]) ? `${TICKER_TABS[t]}/${ticker}` : base;
  return ('/'+m+(tail==='/'?'':tail));
}

async function applyRoute(r,{push=false,replace=false}={}){
  const changedMarket = r.market && r.market!==STATE.market;
  if(r.market) STATE.market=r.market;
  tab=r.tab;
  if(changedMarket){ STATE.fundTicker=null; STATE.openReport=null; STATE.researchTicker=null;
    await loadMarket(); }
  if(r.tab==='fund' && r.ticker) STATE.fundTicker=r.ticker;
  if(r.tab==='research') STATE.openReport=r.ticker||null;
  [...$('#nav').children].forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  document.title = tab==='overview' ? `Trans · ${MKT.label}`
    : `Trans · ${MKT.label} · ${(TABS.find(x=>x[0]===tab)||[])[1]}${r.ticker?' · '+r.ticker:''}`;
  const u=urlFor(r.tab,r.ticker,r.market);
  if(push && location.pathname!==u) history.pushState(r,'',u);
  else if(replace) history.replaceState(r,'',u);
  render();
}

function go(t,ticker){ applyRoute({market:STATE.market,tab:t,ticker:ticker||null},{push:true}); }
function goMarket(m){ setPref('market',m); applyRoute({market:m,tab:tab,ticker:null},{push:true}); }

$('#nav').innerHTML=TABS.map(([k,l,p])=>
  `<button data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join('');
$('#nav').onclick=e=>{const t=e.target.dataset.t; if(!t)return; go(t,null);};
window.addEventListener('popstate',e=>applyRoute(e.state||routeFrom(location.pathname)));

async function loadMarket(){
  STATE.ov=await get('/api/overview?market='+(STATE.market||'us'));
  MKT=STATE.ov.market||MKT;
  const o=STATE.ov.overall,h=STATE.ov.health;
  // Money still in, money already out, and what each earned — kept apart. A single
  // "Invested" figure reads as a collapse the moment you have sold anything: India shows
  // 1.92cr bought against 41L held, and the 1.68cr that came back out has to be visible
  // for the rest to make sense. Realised + unrealised + dividends reconstructs Net
  // gain/loss exactly, which is the arithmetic check that nothing is double counted.
  const px=(v)=>v==null?'<span class="na">n/a</span>':`<span class="${sign(v)}">${pct(v)}</span>`;
  const gain=(v)=>`<span class="${sign(v)}">${usd(v)}</span>`;
  $('#kpis').innerHTML=[
    ['Current value',usd(o.market_value),'Shares held now × the latest price'],
    ['Currently invested',usd(o.cost_basis),
     'What the shares you still hold actually cost. Zerodha reports a split-adjusted '
     +'average; for Robinhood it is weighted-average cost off the order history.'],
    ['Unrealized gain',gain(o.unrealized),'Current value less what those shares cost — on paper, not banked'],
    ['Total invested',usd(o.invested),'Every unit of currency ever spent buying. Not reduced by sales.'],
    ['Total sold',usd(o.proceeds),'Lifetime cash out of sales'],
    // Realised only, on purpose: money actually banked. Unrealized gain sits in its own
    // figure and the two are deliberately not added up here — adding them is what
    // "Net gain/loss" used to do, and it blurred earned with hoped-for.
    ['Realized gain/loss',gain(o.realized+o.dividends),
     `Money actually banked: ${usd(o.realized)} profit on shares sold plus ${usd(o.dividends)} `
     +`in dividends. Excludes the ${usd(o.unrealized)} of unrealized gain on what you still hold.`],
    ['Dividends',usd(o.dividends,2),
     'US: reconstructed from DRIP reinvestment orders, so cash dividends are invisible. '
     +'India: 0 because the Zerodha tradebook carries no dividend rows.'],
    // Four slices of the same flows. Each is a real XIRR over its own subset, never an
    // average of the others — which is why they do not add up to the net figure and are
    // not meant to.
    ['Unrealized XIRR',px(o.xirr_open),
     `Only what you still hold — ${o.n_open||0} position${o.n_open===1?'':'s'}, valued at `
     +`today's price as a final inflow. Closed round-trips are excluded, so this is how `
     +`the things you own are actually doing.`],
    ['Realized XIRR',px(o.xirr_closed),
     `Only positions you have fully sold — ${o.n_closed||0} of them. What the money you `
     +`took back out actually earned while it was deployed.`],
    ['Net XIRR',px(o.xirr),
     'Every trade ever made, open and closed together. The headline, and the one most '
     +'dragged around by short round-trips, because the rate is annualised.'],
    ['XIRR 1Y',px(o.xirr_1y),
     `Positions OPENED in the last 365 days — ${o.n_1y||0} of them, whether since sold or `
     +`still held. Counted that way rather than by every flow landing in the window, `
     +`because a sale whose purchase predates it would bring proceeds with none of the `
     +`cost and read as a spectacular year.`],
    ['Data through',h.last_transaction_date
      ? h.last_transaction_date+(h.days_stale>1?` (${h.days_stale}d old)`:'')
      : 'holdings only', null, 'date']
  ].map(([s,v,t,cls])=>`<div class="kpi${cls?' '+cls:''}"`
      +`${t?` title="${String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"`:''}>`
      +`<span>${s}</span><b>${v}</b></div>`).join('');
  [...$('#mkt').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===STATE.market));
}

async function boot(){
  const mi=await get('/api/markets');
  STATE.market=routeFrom(location.pathname).market||pref('market',null)||mi.default;
  $('#mkt').innerHTML=mi.markets.map(m=>
    `<button data-m="${m.key}" aria-pressed="${m.key===STATE.market}"
      title="${m.currency}">${m.flag} ${m.label}</button>`).join('');
  $('#mkt').onclick=e=>{const m=e.target.closest('button')?.dataset.m; if(m&&m!==STATE.market) goMarket(m);};
  await loadMarket();
  applyRoute(routeFrom(location.pathname),{replace:true});   // deep link / refresh
}
function render(){
  $('#main').classList.toggle('full', tab==='holdings');   // wide table, not prose
  ({overview,holdings,buys,div:divs,analysis,fund,research,sync:syncv}[tab])();
}

function overview(){
  const {overall:o,results:r,health:h}=STATE.ov;
  const open=r.filter(x=>x.market_value>0).sort((a,b)=>b.market_value-a.market_value);
  if(!open.length){ $('#main').innerHTML=`<div class="card"><h2>No data yet</h2>
    <p class="mut">This database is empty. Open Claude Code in this folder and say
    <b>bootstrap</b> to pull your full history, or restore a backup with
    <code>./run.sh --restore</code>.</p></div>`; return; }
  $('#main').innerHTML=`
  ${h.days_stale>2?`<div class="banner">Data is ${h.days_stale} days old. Run a sync from the
    <b>Sync &amp; cost</b> tab.</div>`:''}
  ${(o.unreconciled||[]).length?`<div class="banner">
    <b>${o.unreconciled.length} fund${o.unreconciled.length>1?'s hold':' holds'} more units than the
    imported order history accounts for</b> —
    ${o.unreconciled.map(t=>{const x=r.find(y=>y.ticker===t)||{};
      return `${(x.name||t)} is short ${x.short_units} units`;}).join('; ')}.
    Purchase rows are missing, most likely a financial year absent from the Console
    export. Realized gain/loss is overstated by the value of those missing purchases
    until the gap is filled, because profit is derived as sold − (invested − still held).
    </div>`:''}
  <div class="grid wide">
   <div class="card"><h2>Allocation</h2>
    <div class="row">
     <input id="aq" placeholder="Search name, ticker or category" value="${allocQ}" style="flex:1;min-width:150px">
     <select id="asec">${['',...[...new Set(open.map(p=>p.sector_label))].sort()]
       .map(v=>`<option value="${v}"${v===allocSec?' selected':''}>${v||'All categories'}</option>`).join('')}</select>
    </div>
    <div id="atab">${allocTable(open)}</div></div>
   <div class="card"><h2>Snapshot</h2><table><tbody>
     <tr><td>Positions</td><td>${open.length}</td></tr>
     <tr><td>Transactions</td><td>${fmt(h.n_transactions)}</td></tr>
     <tr><td>Simple return</td><td class="${sign(o.simple_return)}">${pct(o.simple_return)}</td></tr>
     <tr><td>First activity</td><td>${o.first}</td></tr>
     <tr><td>Fundamentals loaded</td><td>${h.n_fundamentals} tickers</td></tr>
   </tbody></table>
   <h2 style="margin-top:18px">Top movers by XIRR</h2>
   ${movers(r)}</div></div>`;
  wireAlloc(open);
}

// Allocation is the list people actually hunt in — "how much Pharma do I hold", "where is
// TITAN" — so it carries its own search, category filter and sortable headers. State is
// module-level so it survives the redraws that filtering causes.
let allocQ=pref('allocQ',''), allocSec=pref('allocSec',''),
    allocKey=pref('allocKey','market_value'), allocDir=pref('allocDir',-1);
function allocRows(open){
  // A remembered category can belong to the other market — "Mutual fund" does not exist
  // on the US side — and would silently empty the table. Drop it rather than show
  // nothing and let the user wonder where their holdings went.
  if(allocSec && !open.some(p=>p.sector_label===allocSec)) allocSec='';
  const q=allocQ.trim().toUpperCase();
  return open.filter(p=>(!allocSec||p.sector_label===allocSec)
      && (!q||p.ticker.toUpperCase().includes(q)||(p.name||'').toUpperCase().includes(q)
             ||(p.sector_label||'').toUpperCase().includes(q)))
    .sort(cmpBy(allocKey,allocDir));
}
// A stock's ticker is how you think of it; a fund's is an ISIN or, on Paytm, a folio and
// a hash — meaningless to read and long enough to force the table sideways. So funds lead
// with their name and carry the key only as a tooltip.
function label(p){
  const synthetic = p.asset==='mf' || /^(PM\d|INF[0-9A-Z]{9})/.test(p.ticker);
  if(synthetic && p.name)
    return `<b class="fname" title="${p.ticker}">${p.name}</b>`;
  return `<b>${p.ticker}</b>${p.name?`<div class="cname">${p.name}</div>`:''}`;
}

function allocTable(open){
  const rows=allocRows(open);
  if(!rows.length) return `<p class="mut">Nothing matches that filter.</p>`;
  const mx=Math.max(...rows.map(p=>p.market_value))||1;
  const shown=rows.reduce((s,p)=>s+p.market_value,0), all=open.reduce((s,p)=>s+p.market_value,0);
  const cols=[['ticker','Ticker'],['sector_label','Category'],['market_value','Value'],
              ['weight','Weight'],['xirr','XIRR']];
  return `<div class="wrap"><table><thead><tr>${cols.map(([k,l])=>
      `<th data-ak="${k}">${l}${allocKey===k?(allocDir<0?' ▾':' ▴'):''}${ih(k)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rows.map(p=>`<tr>
     <td>${label(p)}</td>
     <td class="mut">${p.sector_label}</td>
     <td>${usd(p.market_value)}</td><td>${pct(p.weight,1)}</td>
     <td>${xirrCell(p)}</td>
     <td style="width:26%"><div class="bar"><i style="width:${p.market_value/mx*100}%"></i></div></td>
     </tr>`).join('')}</tbody></table></div>
    <p class="mut" style="font-size:11px;margin-top:8px">${rows.length} of ${open.length} positions`
    +(rows.length<open.length?` — ${usd(shown)} of ${usd(all)}`:'')+`</p>`;
}
function wireAlloc(open){
  const bindSort=()=>{$('#atab').querySelector('thead')?.addEventListener('click',e=>{
    const k=e.target.dataset.ak; if(!k)return;
    if(k===allocKey)allocDir*=-1;
    else{allocKey=k; allocDir=(k==='ticker'||k==='sector_label')?1:-1;}
    setPref('allocKey',allocKey); setPref('allocDir',allocDir);
    redraw();});};
  const redraw=()=>{$('#atab').innerHTML=allocTable(open); bindSort();};
  $('#aq').oninput=e=>{allocQ=e.target.value; setPref('allocQ',allocQ); redraw();};
  $('#asec').onchange=e=>{allocSec=e.target.value; setPref('allocSec',allocSec); redraw();};
  bindSort();
}

// XIRR is an ANNUAL rate, so a short round-trip explodes when annualised: TRIDENT
// turned Rs960 into Rs1,505 over ten days, which is +57% but 1,362,658,947% a year.
// True, and useless. Ranking raw XIRR also surfaced positions sold years ago, which are
// not "movers" in any sense a portfolio dashboard means. So: current holdings only, and
// only once there is enough time for an annual rate to mean something.
function reChip(x){
  return x.re_entered ? ` <span class="chip re" title="Sold out and bought back in `
    +`${x.episodes} separate times. XIRR weights flows by time, so it reflects the first `
    +`episode far more than the money at risk today.">re-entered \u00d7${x.episodes}</span>` : '';
}
// Prefer days actually holding shares; fall back to the elapsed span, marked, when a
// split makes the derived share count untrustworthy.
function heldDays(x){ return x.days_held ?? x.holding_days; }
function heldCell(x){
  const d=heldDays(x); if(d==null) return '—';
  return (x.days_held==null?'~':'')+d;
}

// The same annualisation problem the movers panel dodges, in the table that shows every
// row. TRIDENT turned Rs960 into Rs1,505 over ten days: +56.8%, and 1,362,658,947% a year.
// The figure is arithmetically right and worth nothing, and printing it plainly invites
// exactly the doubt it deserves. Below 90 days held, or above 1000% a year, the cell says
// n/m and carries the real numbers in its tooltip. Simple return sits in the next column
// and stays meaningful throughout.
const XIRR_MIN_DAYS=90, XIRR_MAX=10;
function xirrOK(x){
  if(x.xirr==null) return false;
  const d=heldDays(x);
  return (d==null||d>=XIRR_MIN_DAYS) && Math.abs(x.xirr)<XIRR_MAX;
}
function xirrCell(x){
  if(x.xirr==null)
    return `<span class="mut" title="${(x.note||'no rate').replace(/"/g,'&quot;')}">—</span>`;
  if(xirrOK(x)) return `<span class="${sign(x.xirr)}">${pct(x.xirr,1)}</span>`;
  // Rather than withhold the cell, fall back to the one figure that stays true over any
  // period — the simple return — and mark it, so the column is never silently comparing
  // an annual rate against a nine-day one.
  if(x.simple_return==null)
    return `<span class="mut" title="No usable rate: ${pct(x.xirr,1)} annualised.">—</span>`;
  const d=heldDays(x);
  const t=(d!=null&&d<XIRR_MIN_DAYS)
    ? `Simple return, not annualised — held only ${d} days. Annualising that short a `
      +`period would give ${pct(x.xirr,1)}, which says more about the ${d} days than about `
      +`the holding.`
    : `Simple return, not annualised — the money-weighted rate is ${pct(x.xirr,1)}, above `
      +`1000% a year, which reflects capital deployed briefly rather than performance.`;
  return `<span class="${sign(x.simple_return)}">${pct(x.simple_return,1)}</span>`
    +`<sup class="smark" title="${t.replace(/"/g,'&quot;')}">s</sup>`;
}
// Sorting has to agree with what is shown. An annual rate and a simple return are not
// comparable, so rows showing one are never interleaved with rows showing the other:
// annualised rows rank among themselves, marked rows follow and rank by simple return.
// They stay last in either direction, the same convention the table already uses for
// missing values.
function cmpBy(k,dir){
  return (a,b)=>{
    if(k==='xirr'){
      const ao=xirrOK(a), bo=xirrOK(b);
      if(ao!==bo) return ao?-1:1;
      const A=ao?a.xirr:a.simple_return, B=bo?b.xirr:b.simple_return;
      if(A==null)return 1; if(B==null)return -1;
      return (A>B?1:A<B?-1:0)*dir;
    }
    const A=a[k],B=b[k];
    if(A==null)return 1; if(B==null)return -1;
    return (A>B?1:A<B?-1:0)*dir;
  };
}

const MOVER_MIN_DAYS=90;
function movers(r){
  const ok=r.filter(x=>xirrOK(x) && x.market_value>0 && (heldDays(x)||0)>=MOVER_MIN_DAYS)
            .sort((a,b)=>b.xirr-a.xirr);
  const skipped=r.filter(x=>x.xirr!=null).length-ok.length;
  if(!ok.length) return `<p class="mut">No holding has been open ${MOVER_MIN_DAYS} days yet.</p>`;
  const row=x=>`<tr><td>${x.ticker}${reChip(x)}</td>`
              +`<td class="${x.xirr>=0?'pos':'neg'}">${pct(x.xirr,1)}</td>`
              +`<td class="mut" style="text-align:right;font-size:11px">`
              +`${x.days_held==null?'~':''}${Math.round(heldDays(x)/30)}mo held</td></tr>`;
  const top=ok.slice(0,5), bot=ok.slice(-5).filter(x=>!top.includes(x)).reverse();
  return `<table><tbody>${top.map(row).join('')}${bot.map(row).join('')}</tbody></table>`
    +`<p class="mut" style="margin-top:6px;font-size:11px">Open holdings, ${MOVER_MIN_DAYS}+ days`
    +` actually holding shares.`
    +(skipped?` ${skipped} excluded — closed or too recent to annualise.`:'')
    +` A re-entered position's rate is set mostly by its first episode.</p>`;
}

// What every column means and how it is worked out. Kept in one place because the same
// column appears in Allocation and Holdings and the two must not drift apart, and because
// several of these are exactly where the numbers mislead if you assume the obvious.
const INFO={
 ticker:"Broker symbol, normalised. NSE series codes are stripped (MTARTECH-BE becomes "
   +"MTARTECH) and renamed companies are folded onto the current symbol (GET&D into "
   +"GVT&D) so trades and holdings line up.",
 name:"Company name, from the last fundamentals sync. Blank means it has not been synced "
   +"yet, not that the holding is unknown.",
 sector_label:"Category used to decide which fundamentals matter — P/B leads for banks, "
   +"P/E is omitted for REITs and MLPs. Set by hand in config; 'Unclassified' means "
   +"nobody has mapped it yet.",
 xirr:"Where annualising cannot mean anything — under 90 days held, or above 1000% a "
   +"year — the cell shows the SIMPLE return instead, marked with a small s. Hover it for "
   +"the annualised figure and why it is not shown. "
   +"Money-weighted annual return: solves for the rate that makes every buy (cash out), "
   +"sell (cash in), dividend and today's holding value discount back to zero, on a "
   +"365-day basis. It is ANNUALISED, so a short round-trip explodes: +57% held ten days "
   +"reads as millions of percent. It also weights by time exponentially, so for a "
   +"position you exited and re-entered the rate is set mostly by the first episode.",
 simple_return:"Net P/L divided by Invested. Not annualised and not time-weighted — just "
   +"what came back per unit spent. Read it next to XIRR: when the two disagree wildly, "
   +"the position was traded rather than held.",
 weight:"This holding's value as a share of everything currently held in this market. "
   +"Markets are never blended, so weights sum to 100% within India or within the US.",
 invested:"Every unit of currency ever spent buying, summed over all time. NOT reduced by "
   +"sales — that is what Sold is for.",
 proceeds:"Cash received from sales, over all time. Money already out of the market.",
 market_value:"Shares currently held x the broker's latest price. Only what is still "
   +"owned, which is why it can sit far below Invested once you have sold.",
 dividends:"Dividends recorded. On the US side these are reconstructed from DRIP "
   +"reinvestment orders, so cash dividends taken as cash are invisible. On the India "
   +"side this is 0 because Zerodha's tradebook carries no dividend rows at all.",
 net_profit:"Sold + Dividends + Value - Invested. The whole-life result in currency, "
   +"including positions you have closed.",
 days_held:"Days actually owning shares, not first-to-last span — a position you exited "
   +"and re-entered does not count the gap. A '~' prefix means the derived share count is "
   +"unreliable (a split left pre-split quantities in the order history) so the elapsed "
   +"span is shown instead.",
 n_flows:"How many cash flows fed the XIRR: every buy, sell and dividend, plus today's "
   +"holding value as a final flow. Two or three flows make for a fragile rate.",
};
function ih(k){
  const t=INFO[k]; return t?` <span class="ih" title="${t.replace(/"/g,'&quot;')}">i</span>`:'';
}

// Every trade in one ticker, with each sale showing the buys it actually sold. Matching
// is FIFO — oldest shares first — which is the intuitive reading of "which purchase did
// this sell?" and the rule Indian equity tax uses. The weighted-average cost used for
// portfolio totals cannot answer this at all: it collapses every buy into one number and
// has no lots left to point at.
async function showTrades(ticker){
  const d=await get('/api/trades/'+encodeURIComponent(ticker)+'?market='+STATE.market);
  const money=v=>usd(v);
  const rows=d.rows.map(r=>{
    const cls=r.type==='buy'?'':r.type==='sell'?'sell':'div';
    const head=`<tr class="tr-${r.type}">
      <td>${r.date}</td><td><b>${r.type}</b></td>
      <td>${r.quantity?fmt(r.quantity,r.quantity<10?3:0):''}</td>
      <td>${r.price?money(r.price):''}</td>
      <td>${money(r.amount)}</td>
      <td class="mut">${fmt(r.running,r.running%1?3:0)}</td>
      <td class="${r.realized==null?'mut':sign(r.realized)}">${
        r.type==='sell'?(r.realized==null?'—':money(r.realized)):''}</td></tr>`;
    const lots=(r.matched||[]).map(m=>`<tr class="tr-lot"><td colspan="2" class="mut">
        ↳ sold shares bought ${m.date}</td>
      <td class="mut">${fmt(m.quantity,m.quantity<10?3:0)}</td>
      <td class="mut">${money(m.price)}</td>
      <td class="mut">held ${m.held_days}d</td><td></td>
      <td class="${sign(m.gain)}">${money(m.gain)}</td></tr>`).join('');
    const un=r.unmatched?`<tr class="tr-lot"><td colspan="7" class="mut">
        ↳ ${fmt(r.unmatched,3)} units had no purchase on record — a split, or shares from a
        demerger. Realised is withheld rather than computed from a partial cost.</td></tr>`:'';
    return head+lots+un;
  }).join('');
  const openLots=d.open_lots.length?`<p class="mut" style="font-size:11px;margin-top:10px">
     Still held, oldest first: ${d.open_lots.map(l=>
       `${fmt(l.quantity,l.quantity<10?3:0)} @ ${usd(l.price)} from ${l.date}`).join(' · ')}</p>`:'';
  $('#tlog').innerHTML=`<div class="prhead">
     <div><b>${d.name||d.ticker}</b>${d.name?`<div class="cname">${d.ticker}</div>`:''}</div>
     <button class="act ghost" id="tclose">Close</button></div>
   <div class="wrap" style="max-height:60vh;overflow:auto"><table class="dense"><thead><tr>
     <th>Date</th><th>Type</th><th>Qty</th><th>Price</th><th>Amount</th>
     <th>Holding</th><th>Realised</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${openLots}
   <p class="mut" style="font-size:11px">Sales are matched to purchases first-in-first-out,
    the same basis Indian equity tax uses. Holding shows the running share count after each
    trade.</p>`;
  $('#tclose').onclick=()=>$('#tlog').close();
  $('#tlog').showModal();
}

let sortKey=pref('sortKey','market_value'), sortDir=pref('sortDir',-1),
    holdStatus=pref('holdStatus','all'), holdAsset=pref('holdAsset','all'),
    holdQ=pref('holdQ','');

// Closed positions outnumber open ones five to one here, so a table showing everything is
// mostly history. Status and asset are separate filters because they answer different
// questions — "what do I own now" and "how have my funds done".
function holdRows(all){
  const q=holdQ.trim().toUpperCase();
  return all.filter(x=>{
    if(holdStatus==='open'   && !(x.market_value>0)) return false;
    if(holdStatus==='closed' &&  (x.market_value>0)) return false;
    if(holdAsset==='mf'     && x.asset!=='mf') return false;
    if(holdAsset==='equity' && x.asset!=='equity') return false;
    if(holdAsset==='other'  && ['mf','equity'].includes(x.asset)) return false;
    if(q && !(x.ticker.toUpperCase().includes(q) || (x.name||'').toUpperCase().includes(q)))
      return false;
    return true;
  });
}
function holdings(){
  const all=STATE.ov.results;
  const r=holdRows(all).sort(cmpBy(sortKey,sortDir));
  // Simple sits next to XIRR on purpose: for a position you exited and re-entered they
  // can disagree wildly, and the pair is the tell. MAZDOCK is +438% annualised and
  // +18.6% simple, because XIRR weights by time and the first episode was the small one.
  // Third entry is the shed-order class: c5 goes first as the screen narrows, c1 last.
  const cols=[['ticker','Ticker',''],['sector_label','Sector','c2'],['xirr','XIRR',''],
    ['simple_return','Simple',''],['weight','Weight','c3'],['invested','Invested','c1'],
    ['proceeds','Sold','c4'],['market_value','Value',''],['dividends','Divs','c4'],
    ['net_profit','Net P/L',''],['days_held','Held','c5'],['n_flows','Flows','c5']];
  const seg=(id,cur,opts)=>`<span class="seg" id="${id}">${opts.map(([k,l])=>
    `<button data-v="${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}</span>`;
  $('#main').innerHTML=`<div class="card full"><h2>All holdings — click a header to sort</h2>
   <div class="row">
    <input id="hq" placeholder="Search name or ticker" value="${holdQ}" style="flex:1;min-width:150px">
    ${seg('hstat',holdStatus,[['all','All'],['open','Held now'],['closed','Closed only']])}
    ${seg('hasset',holdAsset,[['all','Everything'],['equity','Stocks'],['mf','Funds'],['other','Other']])}
    <span class="mut" style="font-size:11px">${r.length} of ${all.length}</span>
   </div>
   <div class="wrap"><table class="dense"><thead><tr>${cols.map(([k,l,cl])=>
    `<th data-k="${k}" class="${cl}">${l}${sortKey===k?(sortDir<0?' ▾':' ▴'):''}${ih(k)}</th>`).join('')}</tr></thead>
   <tbody>${r.map(x=>`<tr>
     <td>${label(x)}${x.open?'':' <span class="chip">closed</span>'}${reChip(x)}</td>
     <td class="mut c2">${x.sector_label}</td>
     <td>${xirrCell(x)}</td>
     <td class="${sign(x.simple_return)}">${pct(x.simple_return,1)}</td>
     <td class="c3">${pct(x.weight,1)}</td>
     <td class="c1">${usd(x.invested)}</td><td class="mut c4">${usd(x.proceeds)}</td>
     <td>${usd(x.market_value)}</td><td class="c4">${usd(x.dividends,2)}</td>
     <td class="${sign(x.net_profit)}">${usd(x.net_profit)}</td>
     <td class="mut c5">${heldCell(x)}</td><td class="mut c5">${x.n_flows>0
       ?`<a href="#" class="flowlink" data-t="${encodeURIComponent(x.ticker)}"
           title="Show every trade, with each sale matched to the buys it sold">${x.n_flows}</a>`
       :x.n_flows}</td></tr>`).join('')}
   </tbody></table>
   <p class="mut" style="font-size:11px;margin-top:8px">
     <b class="chip re">re-entered</b> sold out completely and bought back in — XIRR is set
     mostly by the earliest episode, so read <b>Simple</b> alongside it.
     <b>Invested</b> is every unit of currency ever spent buying; <b>Sold</b> is what came
     back out. Value is only what is still held, so the three read together.
     <b>Held</b> counts days actually owning shares, not first-to-last span;
     <b>~</b> means the share count is unreliable (a split left pre-split quantities in
     the order history) so the elapsed span is shown instead.</p>
   </div></div>`;
  $('#main').querySelector('thead').onclick=e=>{const k=e.target.dataset.k; if(!k)return;
    if(k===sortKey)sortDir*=-1; else{sortKey=k;sortDir=-1;}
    setPref('sortKey',sortKey); setPref('sortDir',sortDir); holdings();};
  $('#hq').oninput=e=>{holdQ=e.target.value; setPref('holdQ',holdQ); holdings();
    const i=$('#hq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length);};
  $('#hstat').onclick=e=>{const v=e.target.dataset.v; if(!v)return;
    holdStatus=v; setPref('holdStatus',v); holdings();};
  $('#hasset').onclick=e=>{const v=e.target.dataset.v; if(!v)return;
    holdAsset=v; setPref('holdAsset',v); holdings();};
  $('#main').onclick=e=>{const a=e.target.closest('.flowlink'); if(!a)return;
    e.preventDefault(); showTrades(decodeURIComponent(a.dataset.t));};
}

async function buys(){
  $('#main').innerHTML='<div class="card">loading…</div>';
  const days=STATE.buyDays||pref('buyDays',30);
  const [d,p]=await Promise.all([get('/api/daily-buys?days='+days+'&market='+STATE.market),get('/api/buy-program?days='+days+'&market='+STATE.market)]);
  $('#main').innerHTML=`
  <div class="card"><h2>Recurring programme — last ${p.days} trading days</h2>
   <p class="mut">${usd(p.total)} deployed · <b>${usd(p.per_day)}/day</b> across ${p.tickers.length} tickers</p>
   <div class="wrap"><table><thead><tr><th>Ticker</th><th>Sector</th><th>Total</th>
    <th>Buys</th><th>Per buy</th><th>Share of new $</th></tr></thead><tbody>
    ${p.tickers.map(t=>`<tr><td><b>${t.ticker}</b></td><td class="mut">${t.sector_label}</td>
     <td>${usd(t.amount)}</td><td>${t.n}</td><td>${usd(t.per_buy,2)}</td>
     <td><div class="bar" style="display:inline-block;width:70px;vertical-align:middle">

  <div class="card"><h2>Day by day
    <select id="dsel" style="float:right">${[7,14,30,60,90].map(n=>
      `<option ${n===days?'selected':''}>${n}</option>`).join('')}</select></h2>

     <span>${usd(x.total,2)} · ${x.n} orders</span></div>
     <div>${x.items.map(i=>`<span class="tick"><b>${i.ticker}</b> ${usd(i.amount,2)}</span>`).join('')}</div>
   </div>`).join('')||'<p class="mut">No buys in range.</p>'}</div>`;
  $('#dsel').onchange=e=>{STATE.buyDays=+e.target.value;setPref('buyDays',STATE.buyDays);buys();};

async function divs(){
  const d=await get('/api/dividends?market='+STATE.market);
  const mx=Math.max(...d.by_year.map(y=>y.amount));
  $('#main').innerHTML=`
   <div class="card"><h2>Dividends — ${usd(d.total,2)} lifetime</h2>
    <table><tbody>${d.by_year.map(y=>`<tr><td>${y.year}</td>
      <td style="width:55%"><div class="bar"><i style="width:${y.amount/mx*100}%"></i></div></td>
      <td>${usd(y.amount,2)}</td><td class="mut">${y.n} payments</td></tr>`).join('')}</tbody></table></div>
   <div class="card"><h2>By ticker</h2><div class="wrap"><table>
    <thead><tr><th>Ticker</th><th>Received</th><th>Payments</th><th>Share</th></tr></thead><tbody>
    ${d.by_ticker.map(t=>`<tr><td><b>${t.ticker}</b></td><td>${usd(t.amount,2)}</td>
     <td class="mut">${t.n}</td><td>${pct(t.amount/d.total,1)}</td></tr>`).join('')}
    </tbody></table></div></div>`;

// The monthly series is the raw material; quarters and years are rolled up in the
// browser rather than round-tripping, because /api/contributions already returns every
// month there has ever been and the aggregation is a group-by.
let contribPeriod=pref('contribPeriod','month'), contribYears=pref('contribYears',2),
    contribAsset=pref('contribAsset','all');
const ASSET_LABEL={equity:'Stocks',mf:'Mutual funds',crypto:'Crypto',
                   sgb:'Gold bonds',bond:'Bonds'};
function contribBucket(m,p){
  const y=+m.slice(0,4), mo=+m.slice(5,7);
  return p==='year'?String(y):p==='quarter'?`${y}-Q${Math.ceil(mo/3)}`:m;
}
function contribSeries(ser){
  let cut='0000-00';
  if(contribYears!=='all'){const d=new Date(); d.setFullYear(d.getFullYear()-contribYears);
    cut=d.toISOString().slice(0,7);}
  const agg=new Map();
  for(const x of ser){ if(x.month<cut) continue;
    const k=contribBucket(x.month,contribPeriod);
    const v=contribAsset==='all'?x:((x.by_asset||{})[contribAsset]||{bought:0,sold:0,realized:0});
    if(contribAsset!=='all' && !v.bought && !v.sold && !v.realized) continue;
    const a=agg.get(k)||{label:k,bought:0,sold:0,realized:0};
    a.bought+=v.bought; a.sold+=v.sold; a.realized+=v.realized; agg.set(k,a); }
  return [...agg.values()].sort((a,b)=>a.label<b.label?-1:1);
}
function contribCard(cn){
  // Same for a remembered asset filter: India has mutual funds, the US has crypto.
  if(contribAsset!=='all' && !(cn.assets||[]).includes(contribAsset)) contribAsset='all';
  const cs=contribSeries(cn.series);
  const cm=Math.max(...cs.map(x=>x.bought),0)||1;
  const tot=cs.reduce((a,x)=>({bought:a.bought+x.bought,sold:a.sold+x.sold,
    realized:a.realized+x.realized}),{bought:0,sold:0,realized:0});
  const skip=(cn.realized_skipped||[]).length;
  const per=[['month','Monthly'],['quarter','Quarterly'],['year','Yearly']];
  const spans=[[1,'1y'],[3,'3y'],[5,'5y'],[10,'10y'],['all','All']];
  return `<h2>New capital deployed</h2>
   <div class="row">
    <span class="lbl">Group by</span>
    <span class="seg" id="cper">${per.map(([k,l])=>
      `<button data-v="${k}" aria-pressed="${k===contribPeriod}">${l}</button>`).join('')}</span>
    <span class="lbl" style="margin-left:8px">Span</span>
    <span class="seg" id="cspan">${spans.map(([k,l])=>
      `<button data-v="${k}" aria-pressed="${String(k)===String(contribYears)}">${l}</button>`).join('')}</span>
    ${(cn.assets||[]).length>1?`<span class="lbl" style="margin-left:8px">Asset</span>
     <span class="seg" id="casset">${[['all','All'],...cn.assets.map(a=>[a,ASSET_LABEL[a]||a])]
       .map(([k,l])=>`<button data-v="${k}" aria-pressed="${k===contribAsset}">${l}</button>`).join('')}</span>`:''}
   </div>
   ${cs.length?`<div class="wrap"><table><thead><tr><th>Period</th><th></th>
     <th>Bought</th><th>Sold</th><th>Net cash</th><th>Booked P/L</th></tr></thead>
    <tbody>${cs.map(x=>`<tr><td>${x.label}</td>
     <td style="width:34%"><div class="bar"><i style="width:${x.bought/cm*100}%"></i></div></td>
     <td>${usd(x.bought)}</td><td class="mut">${usd(x.sold)}</td>
     <td class="${sign(x.sold-x.bought)}">${usd(x.sold-x.bought)}</td>
     <td class="${sign(x.realized)}">${x.realized?usd(x.realized):'—'}</td></tr>`).join('')}
    </tbody><tfoot><tr><th>Total</th><th></th>
     <th>${usd(tot.bought)}</th><th class="mut">${usd(tot.sold)}</th>
     <th class="${sign(tot.sold-tot.bought)}">${usd(tot.sold-tot.bought)}</th>
     <th class="${sign(tot.realized)}">${usd(tot.realized)}</th></tr></tfoot></table></div>
    <p class="mut" style="font-size:11px;margin-top:8px">
     <b>Net cash</b> is sold minus bought — negative means you put money in that period.
     <b>Booked P/L</b> is profit actually banked on the shares sold, using weighted-average
     cost.${skip?` It skips ${skip} ticker${skip>1?'s':''} that sold more shares than the
     order history shows them buying — that is what a split looks like, and a per-share
     average there would invent a loss. Those sales still count in Sold, so this column
     totals less than the Booked P/L in the header.`:''}
     Trailing 12 months bought <b>${usd(cn.trailing_12m)}</b>${contribAsset!=='all'
       ?` (all assets). Showing <b>${ASSET_LABEL[contribAsset]||contribAsset}</b> only.`:'.'}</p>`
    :`<p class="mut">No ${contribAsset==='all'?'':((ASSET_LABEL[contribAsset]||contribAsset)+' ')}activity
      in this window.${contribAsset!=='all'?' Try a longer span — this asset may simply be older than it.':''}</p>`}`;
}

async function fund(){
  const eligible=STATE.ov.results.filter(r=>r.market_value>0&&r.sector!=='crypto'&&!['mf','sgb','bond'].includes(r.asset))
    .sort((a,b)=>b.market_value-a.market_value);
  if(!eligible.length){ $('#main').innerHTML=`<div class="card"><h2>No holdings yet</h2>
    <p class="mut">Run a sync first, then <b>sync fundamentals</b> in Claude Code.</p></div>`; return; }
  const tick=STATE.fundTicker||eligible[0].ticker;
  const opts=eligible.map(r=>r.ticker).sort();
  // Up to three side by side. Sector decides the metric set, so comparing across sectors
  // gives a sparse table on purpose — a bank has no P/E row to line up against a chipmaker,
  // and filling one in would be worse than leaving the gap visible.
  if(STATE.fundT2===undefined) STATE.fundT2=pref('fundT2','');
  if(STATE.fundT3===undefined) STATE.fundT3=pref('fundT3','');
  // A remembered comparison ticker you no longer hold would 404 the fetch.
  if(STATE.fundT2 && !opts.includes(STATE.fundT2)) STATE.fundT2='';
  if(STATE.fundT3 && !opts.includes(STATE.fundT3)) STATE.fundT3='';
  const picks=[tick,STATE.fundT2||'',STATE.fundT3||''].filter(Boolean);
  const fs=await Promise.all(picks.map(t=>get('/api/fundamentals/'+t)));
  const fmtv=(m)=>{if(!m||m.value==null)return `<span class="miss">not loaded</span>`;
    if(m.fmt==='%')return pct(m.value,1); if(m.fmt==='$')return usd(m.value);
    if(m.fmt==='x')return fmt(m.value,2)+'×'; if(m.fmt==='d')return fmt(m.value,0)+' d';
    return fmt(m.value,2);};
  const sel=(id,val)=>`<select id="${id}">${(id==='tsel'?'':'<option value="">— none —</option>')
    +opts.map(t=>`<option ${t===val?'selected':''}>${t}</option>`).join('')}</select>`;
  const cmp=fs.length>1;
  // union of metrics, in the order the first ticker lists them, then any extras
  const keys=[]; for(const f of fs) for(const m of f.metrics) if(!keys.includes(m.metric)) keys.push(m.metric);
  const label={}; for(const f of fs) for(const m of f.metrics) label[m.metric]=m.label;
  const dir={};   for(const f of fs) for(const m of f.metrics) dir[m.metric]=m.higher_better;
  const at=(f,k)=>f.metrics.find(m=>m.metric===k);
  // in compare mode mark the best value per row, but only where every ticker has one and
  // they actually share the metric — "best P/E" across a bank and an ETF is meaningless
  const best=(k)=>{ if(!cmp)return null;
    const vs=fs.map(f=>at(f,k)).map(m=>m&&m.value!=null?m.value:null);
    if(vs.some(v=>v==null))return null;
    const t=dir[k]?Math.max(...vs):Math.min(...vs);
    return vs.every(v=>v===vs[0])?null:vs.indexOf(t); };

  $('#main').innerHTML=`<div class="card">
   <h2>Fundamentals</h2>
   <div class="row"><span class="lbl">Compare</span>
     ${sel('tsel',tick)}${sel('tsel2',STATE.fundT2||'')}${sel('tsel3',STATE.fundT3||'')}
     <span class="mut" style="font-size:11px">pick up to three</span></div>
   ${cmp?'':`<p class="mut"><b>${fs[0].ticker}</b>${fs[0].name?` — ${fs[0].name}`:''} ·
    ${fs[0].sector_label}. Metric set is chosen for this sector: P/E is omitted where it
    misleads (REITs, MLPs), P/B leads for banks, and ETFs show only fund-level figures.
    Coverage ${pct(fs[0].coverage,0)}.</p>`}
   <div class="wrap"><table><thead><tr><th>Metric</th>
     ${fs.map(f=>`<th>${f.ticker}${f.name?`<div class="cname">${f.name}</div>`:''}
       <div class="cname">${f.sector_label} · ${pct(f.coverage,0)} covered</div></th>`).join('')}
     <th>Direction</th></tr></thead><tbody>
    ${keys.map(k=>{const b=best(k); return `<tr><td>${label[k]}</td>
     ${fs.map((f,i)=>`<td${b===i?' class="pos"':''}>${fmtv(at(f,k))}</td>`).join('')}
     <td class="mut">${dir[k]?'higher better':'lower better'}</td></tr>`;}).join('')}
   </tbody></table></div>
   ${cmp?`<p class="mut" style="font-size:11px;margin-top:8px">Green marks the better
     figure, and only where every ticker has one — comparing a metric across sectors that
     do not share it would be meaningless.</p>`:''}
   ${fs.some(f=>f.coverage<1)?`<p class="mut" style="margin-top:12px">Missing metrics need a
     fundamentals sync — see <b>Sync &amp; cost</b>.</p>`:''}</div>
   <div id="rep"></div>`;
  $('#tsel').onchange=e=>{STATE.fundTicker=e.target.value;go('fund',e.target.value);};
  $('#tsel2').onchange=e=>{STATE.fundT2=e.target.value;setPref('fundT2',STATE.fundT2);fund();};
  $('#tsel3').onchange=e=>{STATE.fundT3=e.target.value;setPref('fundT3',STATE.fundT3);fund();};
  // The research report for this ticker, if one has been run. Only in single view — three
  // reports side by side would not be readable.
  if(!cmp && STATE.fundHideRep!==tick) showReport(tick,{scroll:false,tab:'fund'});
}

      if(v==='__other'){ STATE.otherTicker=STATE.otherTicker||'';
        oth.style.display='inline-block'; chk.style.display='inline-block'; oth.focus(); }
      else { STATE.otherTicker=null; STATE.probeMsg=''; oth.style.display='none';
        chk.style.display='none'; STATE.researchTicker=v; }
    };
    if(oth) oth.oninput=e=>{STATE.otherTicker=e.target.value.trim().toUpperCase();};
    if(chk) chk.onclick=async()=>{
      const sym=(oth.value||'').trim().toUpperCase();
      if(!sym) return;
      chk.disabled=true; $('#probeline').textContent='Checking '+sym+'…';
      const r=await post('/api/analysis/probe',{ticker:sym});
      chk.disabled=false;
      $('#probeline').innerHTML = r.ok
        ? `<span class="pos">✓ ${sym}</span> — ${r.name||''} ${r.last!=null?`· last ${r.last} ${r.currency||''}`:''}`
        : `<span class="neg">✗ ${sym} not found.</span> ` + (sym.includes('.')
            ? `Check the symbol on Yahoo Finance — some tickers change after a split or demerger.`
            : `Non-US symbols need a suffix: try <code>${sym}.NS</code> (NSE) or <code>${sym}.BO</code> (BSE).`);
      STATE.probeMsg=$('#probeline').innerHTML;
    };
    const ms=$('#rmodel');
    if(ms) ms.onchange=async e=>{
      STATE.researchModel=e.target.value;
      const n=await post('/api/analysis/estimate',{ticker:$('#rsel').value,model:e.target.value});
      $('#estline').innerHTML=estLine(n);
    };
  }
  if(STATE.openReport) showReport(STATE.openReport);
  if(running.length) setTimeout(()=>{if(tab==='research')research();},5000);

  $('#main').onclick=async e=>{
    const op=e.target.dataset&&e.target.dataset.open;
    if(op){go('research',op);return;}
    if(e.target.id==='runr'){
      const t=$('#rsel').value==='__other'
        ? ($('#rother').value||'').trim().toUpperCase() : $('#rsel').value;
      if(!t){alert('Enter a ticker symbol.');return;}
      const mdl=$('#rmodel')?$('#rmodel').value:null;
      if(a.paid){
        const cur=await post('/api/analysis/estimate',{ticker:t,model:mdl});
        const ok=confirm(`Run TradingAgents on ${t} using the Anthropic API?\n\n`
          +`Model: ${mdl}\n`
          +`Estimated ${usd(cur.low,2)}–${usd(cur.high,2)} across ~${cur.calls} model calls.\n`
          +`This is an ESTIMATE — actual usage varies and is logged after the run.\n`
          +(cur.verified?'':'Pricing in pricing.json is UNVERIFIED.\n')
          +`\nThis will be billed to your API key.`);
        if(!ok) return;
      }
      e.target.disabled=true; e.target.textContent='Starting…';
      const r=await post('/api/analysis/run',{ticker:t,model:mdl,consented:a.paid});
      if(!r.ok) alert('Could not start: '+(r.error||'unknown'));
      research();
    }
  };
}

function estLine(e){
  return `Estimated <b>${usd(e.low,2)}–${usd(e.high,2)}</b> per run — about ${e.calls}
   model calls, of which only ${e.deep_calls} use the reasoning model; the rest run on
   <b>${e.quick_think_llm.replace(/-\d{8}$/,'')}</b> to keep cost down.
   An estimate calibrated on one observed run, not a quote — actual usage is logged
   afterwards. ${e.verified?'':'<span class="neg">Rates in pricing.json are unverified.</span>'}`;
}

function renderProgress(j){
  const p=j.progress;
  if(!p) return `<p class="mut">Analysing <b>${j.ticker}</b> since
    ${j.started.replace('T',' ')} — starting up.</p>`;
  const ag=p.agents||[];
  const done=ag.filter(a=>a.state==='done').length, tot=ag.length;
  const ICON={running:'run',done:'done',error:'err',pending:'',skipped:'skip'};
  let rows='', stage=null;
  for(const a of ag){
    if(a.stage!==stage){stage=a.stage;
      rows+=`<tr><td class="stage" colspan="5">${stage}</td></tr>`;}
    const st=a.state||'pending';
    rows+=`<tr class="${st==='pending'?'pending':''}">
      <td><span class="dot ${ICON[st]||''}"></span>${a.label||a.agent}</td>
      <td class="mut">${st==='pending'?'waiting':st==='skipped'?'not used':st}</td>
      <td>${a.calls?fmt(a.calls):'<span class="mut">—</span>'}</td>
      <td>${a.input?fmt(a.input)+' / '+fmt(a.output):'<span class="mut">—</span>'}</td>
      <td>${a.cost_usd?usd(a.cost_usd,4):'<span class="mut">—</span>'}</td></tr>`;
  }
  const t=p.totals||{};
  const cur=ag.find(a=>a.agent===p.current);
  return `<p class="mut">Analysing <b>${j.ticker}</b> · ${done}/${tot} agents ·
    ${p.elapsed_s}s · ${p.llm_calls} model call${p.llm_calls===1?'':'s'}
    ${cur?`· running <b>${cur.label}</b>`:''}</p>
   <div class="bar" style="margin:6px 0 12px"><i style="width:${tot?done/tot*100:0}%"></i></div>
   ${p.llm_calls?'':'<p class="mut">Gathering market data — no model calls yet.</p>'}
   <div class="wrap"><table><thead><tr><th>Agent</th><th>State</th><th>Calls</th>
     <th>Tokens in / out</th><th>Cost</th></tr></thead>
     <tbody>${rows}</tbody>
     <tfoot><tr><th>Total</th><th></th><th>${p.llm_calls}</th>
       <th>${fmt(t.input_tokens||0)} / ${fmt(t.output_tokens||0)}</th>
       <th>${p.cost_usd?usd(p.cost_usd,4):'—'}</th></tr></tfoot></table></div>`;
}

// minimal markdown -> HTML: headings, bold, bullets, and GFM tables (the analyst
// sections are full of them — 89 table rows in the fundamentals report alone).
// A dependency-free renderer keeps the stdlib-only promise.
function md(t){
  const esc=x=>x.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const inl=x=>colorise(x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>'));
  const lines=esc(t||'').split('\n');
  const out=[]; let ul=false, i=0;
  const closeUl=()=>{if(ul){out.push('</ul>');ul=false;}};
  while(i<lines.length){
    const raw=lines[i].trim();
    // table: header row, separator row, then body
    if(raw.startsWith('|') && /^\|[\s:|-]+\|?$/.test((lines[i+1]||'').trim())){
      closeUl();
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(raw); i+=2;
      const body=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){ body.push(cells(lines[i].trim())); i++; }
      out.push(`<div class="wrap"><table><thead><tr>${head.map(h=>`<th>${inl(h)}</th>`).join('')}
        </tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`)
        .join('')}</tbody></table></div>`);
      continue;
    }
    if(!raw){ closeUl(); i++; continue; }
    const h=raw.match(/^#{1,6}\s+(.*)$/);
    if(h){ closeUl(); out.push(`<h3>${inl(h[1])}</h3>`); i++; continue; }
    const li=raw.match(/^[-*•]\s+(.*)$/)||raw.match(/^\d+[.)]\s+(.*)$/);
    if(li){ if(!ul){out.push('<ul>');ul=true;} out.push(`<li>${inl(li[1])}</li>`); i++; continue; }
    closeUl();
    const en=splitEnum(raw);
    if(en){
      if(en.lead) out.push(`<p>${inl(en.lead)}</p>`);
      out.push(`<ol>${en.items.map(it=>`<li>${inl(it)}</li>`).join('')}</ol>`);
    } else out.push(`<p>${inl(raw)}</p>`);
    i++;
  }
  closeUl(); return out.join('');
}

// Tint the judgement words so a wall of prose can be skimmed.
// Case-sensitive on purpose: the reports capitalise verdicts ("Rating: Hold",
// "shift toward Overweight") but use the same words lowercase in ordinary prose
// ("investors hold", "add capacity"), where colouring them would be noise.
// Bullish/Bearish are the exception — always a judgement, so matched either case.
function colorise(x){
  const POS=/\b(Strong Buy|Buy|Overweight|Outperform|Accumulate|Add to)\b/g;
  const NEG=/\b(Strong Sell|Sell|Underweight|Underperform|Trim|Reduce|Avoid|Exit)\b/g;
  const NEU=/\b(Hold|Neutral|Market Perform|Maintain)\b/g;
  return x
    .replace(/\b(Confidence|Conviction)\b(\s*:?\s*)(High|Medium|Moderate|Low)\b/gi,
      (m,k,sep,v)=>`${k}${sep}<span class="pill ${/high/i.test(v)?'hi':/low/i.test(v)?'lo':'mid'}">${v}</span>`)
    .replace(/\bScore\b(\s*:?\s*)(-?\d+(?:\.\d+)?)(\s*\/\s*(\d+))?/gi,(m,sep,n,rest,den)=>{
      const v=parseFloat(n), d=den?parseFloat(den):10, r=v/d;
      const cls=r>=0.66?'hi':r<=0.33?'lo':'mid';
      return `Score${sep}<span class="pill ${cls}">${n}${rest||''}</span>`;})
    .replace(/\b(bullish)\b/gi,'<span class="pos"><strong>$1</strong></span>')
    .replace(/\b(bearish)\b/gi,'<span class="neg"><strong>$1</strong></span>')
    .replace(POS,'<span class="pos"><strong>$1</strong></span>')
    .replace(NEG,'<span class="neg"><strong>$1</strong></span>')
    .replace(NEU,'<span class="warnw"><strong>$1</strong></span>');
}

// A paragraph like "**Strategic Actions**: 1) do x 2) do y" is a list wearing a
// paragraph's clothes. Split it so each action gets its own line.
//
// Only "N)" (paren) enumerators are treated as list markers. "N." is too common in
// ordinary prose — an earlier version split "assumes scenario 1 or 2. The Conservative
// Analyst..." into bogus items, because the "2." there is a number in a sentence, not a
// marker. Paren style is unambiguous and is what these reports actually use.
function splitEnum(t){
  if(!/\s2\)\s/.test(t)) return null;
  const m=t.match(/^(.*?)(?=\b1\)\s)/);
  let lead=m?m[1]:'';
  const rest=t.slice(lead.length);
  lead=lead.replace(/[\s:—–-]+$/,'').trim();          // drop the trailing separator
  const parts=rest.split(/\s+(?=\d+\)\s)/)
    .map(x=>x.replace(/^\d+\)\s*/,'').trim())
    .filter(x=>x && /[A-Za-z]/.test(x));               // no empty or punctuation-only items
  if(parts.length<2) return null;
  return {lead: lead.length && lead.length<200 ? lead : null, items: parts};
}

// pull the headline fields out of the decision text for an at-a-glance summary
function grabField(txt,k){
  const m=(txt||'').match(new RegExp('\\*\\*'+k+'\\*\\*\\s*:?\\s*([^\n]+)','i'));
  return m?m[1].replace(/^\**|\**$/g,'').trim():null;
}
function ratingClass(r){
  if(/strong buy|buy|overweight|accumulate/i.test(r||'')) return 'buy';
  if(/sell|underweight|reduce|trim/i.test(r||'')) return 'sell';
  return 'hold';
}
function verdict(txt){
  const r=grabField(txt,'Rating')||grabField(txt,'Recommendation')||grabField(txt,'Decision');
  const pt=grabField(txt,'Price Target'), th=grabField(txt,'Time Horizon');
  const conf=grabField(txt,'Confidence');
  if(!r&&!pt&&!th) return '';
  return `<div class="verdict">
    ${r?`<div><span>Rating</span><b><span class="rating ${ratingClass(r)}">${r}</span></b></div>`:''}
    ${pt?`<div><span>Price target</span><b>${pt}</b></div>`:''}
    ${conf?`<div><span>Confidence</span><b style="font-size:14px">${conf}</b></div>`:''}
    ${th?`<div><span>Horizon</span><b style="font-size:14px">${th}</b></div>`:''}
  </div>`;
}

// executive summary, if the decision text carries one
function summaryOf(txt){
  const m=(txt||'').match(/\*\*Executive Summary\*\*\s*:?\s*([\s\S]*?)(?=\n\s*\*\*|$)/i);
  return m?m[1].trim():null;
}

// what the report means against the position Trans actually holds
function dcaPanel(ctx,decTxt){
  if(!ctx) return '';
  const pt=parseFloat((grabField(decTxt,'Price Target')||'').replace(/[^0-9.]/g,''));
  const px=ctx.quantity?ctx.market_value/ctx.quantity:null;
  const vsAvg=(px&&ctx.avg_cost)?(px/ctx.avg_cost-1):null;
  const vsTgt=(pt&&px)?(pt/px-1):null;
  return `<div class="dca"><h4>Against your actual position</h4>
   <div class="g">
    <div><span>You buy</span><b>${usd(ctx.per_buy,2)}/day</b></div>
    <div><span>≈ per month</span><b>${usd(ctx.monthly)}</b></div>
    <div><span>Invested</span><b>${usd(ctx.invested)}</b></div>
    <div><span>Now worth</span><b>${usd(ctx.market_value)}</b></div>
    <div><span>Your avg cost</span><b>${usd(ctx.avg_cost,2)}</b></div>
    <div><span>Your XIRR</span><b class="${sign(ctx.xirr)}">${pct(ctx.xirr,1)}</b></div>
    <div><span>Portfolio weight</span><b>${pct(ctx.weight,1)}</b></div>
   </div>
   <p class="mut" style="margin:11px 0 0">
    Price is <b class="${sign(vsAvg)}">${vsAvg==null?'—':pct(vsAvg,1)}</b> versus your average cost.
    ${vsTgt!=null?`The report's target implies <b class="${sign(vsTgt)}">${pct(vsTgt,1)}</b> from here.`:''}
    At ${usd(ctx.per_buy,2)}/day this position represents about
    <b>${fmt(ctx.days_of_buying)}</b> days of buying.<br>
    <b>The report below does not know any of this.</b> TradingAgents analyses the ticker
    in isolation — it takes only a symbol and a date, with no way to tell it you are
    dollar-cost-averaging. A rating aimed at a lump-sum trader answers a different
    question than "should I keep adding ${usd(ctx.per_buy,2)} a day", where entry timing
    matters far less than whether you still want to own the business.</p>
  </div>`;
}

// Also used from the Fundamentals tab, where the report is a secondary panel rather than
// the whole point of the page: it must not yank the viewport, and Close must return to the
// tab you were actually on.
async function showReport(t,opt={}){
  const r=await get('/api/analysis/'+t);
  if(!r.sections||!r.sections.length){$('#rep').innerHTML='';return;}
  const dec=r.sections.find(s=>s.kind==='ta:decision');
  const decTxt=dec?dec.content:'';
  const summary=summaryOf(decTxt);
  const STAGE={decision:'Decision',trader:'Trading',research_mgr:'Research debate',
    bull:'Research debate',bear:'Research debate',fundamentals:'Analysts',
    market:'Analysts',news:'Analysts',sentiment:'Analysts',
    risk_aggr:'Risk debate',risk_neutral:'Risk debate',risk_cons:'Risk debate'};
  const byStage={};
  for(const s of r.sections){
    const st=STAGE[s.kind.replace('ta:','')]||'Other';
    (byStage[st]=byStage[st]||[]).push(s);
  }
  const order=['Decision','Trading','Research debate','Risk debate','Analysts','Other'];
  window.__rep=r;   // for the copy buttons
  $('#rep').innerHTML=`<div class="card">
   <div class="rep-head">
     <div><h2 style="margin:0">${t} — research report</h2>
       <p class="mut" style="margin:6px 0 0">${(r.created_at||'').replace('T',' ').slice(0,19)}
        · <code>${(r.source||'').replace(/[<>&]/g,'')}</code> · ${r.sections.length} sections</p></div>
     <div><button class="act ghost" id="copyall">Copy whole report</button>
       <button class="act ghost" id="closerep" style="margin-left:6px">Close</button></div>
   </div>
   ${verdict(decTxt)}
   ${r.plain
     ?`<div class="dca"><h4>In plain English
        <button class="copy" data-copy="plain" style="margin-left:6px">copy</button>
        <button class="copy" id="replain" style="margin-left:4px">redo</button></h4>
       <div class="md">${md(r.plain)}</div></div>`
     :`<div class="dca"><h4>In plain English</h4>
       <p class="mut" style="margin:0 0 9px">The report below is dense financial writing.
        This rewrites it as short bullets, in language aimed at someone new to investing,
        and framed for buying a little every day.</p>
       <button class="act" id="explain">Explain simply</button>
       <span class="mut" style="font-size:12px;margin-left:8px">one extra model call,
        about ${usd(0.022,3)} — billed</span></div>`}
   ${summary?`<div class="dca"><h4>Summary (from the report)</h4><div class="md">${md(summary)}</div></div>`:''}
   ${dcaPanel(r.context,decTxt)}
   <p class="mut">Generated by TradingAgents, a third-party multi-agent model.
    Research output — <b>not a recommendation</b>, and not checked by Trans.</p>
   ${order.filter(k=>byStage[k]).map(k=>`
     <div class="stage">${k}</div>
     ${byStage[k].map(s=>`<details ${k==='Decision'?'open':''} style="margin-bottom:6px">
       <summary style="cursor:pointer;font-weight:600;padding:7px 0"
         ><span class="chev">▶</span>${s.label}
         <span class="secbtns"><button class="copy" data-copy="${s.kind}">copy</button></span
         ></summary>
       <div class="md">${md(s.content)}</div></details>`).join('')}`).join('')}
  </div>`;
  $('#closerep').onclick=()=>{
    STATE.openReport=null; $('#rep').innerHTML='';
    // On Fundamentals the report is a panel on a page that stays put, so Close just
    // hides it — routing away would re-run fund() and reopen it. The flag is per ticker,
    // so switching ticker brings the report back.
    if(opt.tab==='fund') STATE.fundHideRep=t; else go('research',null);
  };
  $('#rep').onclick=async e=>{
    const k=e.target.dataset&&e.target.dataset.copy;
    if(k){
      e.preventDefault(); e.stopPropagation();
      const txt = k==='plain' ? window.__rep.plain
        : (()=>{const sec=window.__rep.sections.find(x=>x.kind===k);
                return `## ${sec.label}\n\n${sec.content}`;})();
      await navigator.clipboard.writeText(txt);
      const o=e.target.textContent; e.target.textContent='copied';
      setTimeout(()=>e.target.textContent=o,1200);
    }
    if(e.target.id==='explain'||e.target.id==='replain'){
      const ok=confirm(`Rewrite the ${t} report in plain English?\n\n`
        +`One call to claude-haiku-4-5, roughly $0.02, billed to your API key.\n`
        +`Actual cost is logged afterwards.`);
      if(!ok) return;
      e.target.disabled=true; e.target.textContent='Writing…';
      const res=await post('/api/analysis/explain',{ticker:t,consented:true});
      if(!res.ok){alert('Failed: '+(res.error||'unknown'));}
      showReport(t); return;
    }
    if(e.target.id==='copyall'){
      const R=window.__rep;
      const txt=[`# ${R.ticker} — TradingAgents report`,
        `${R.created_at} · ${R.source}`,
        'Third-party generated research, not a recommendation.','',
        ...R.sections.map(s=>`## ${s.label}\n\n${s.content}`)].join('\n');
      await navigator.clipboard.writeText(txt);
      e.target.textContent='Copied'; setTimeout(()=>e.target.textContent='Copy whole report',1400);
    }
  };
  if(opt.scroll!==false) $('#rep').scrollIntoView({behavior:'smooth',block:'start'});
}

boot();
// pick up out-of-band ingests (Claude Code writing straight to the DB) without a manual reload
setInterval(async()=>{
  try{
    const h=await get('/api/health?market='+(STATE.market||'us'));
    if(h.n_transactions!==STATE.ov.health.n_transactions){
      await loadMarket();
      render();
    }
  }catch(e){}
},20000);
